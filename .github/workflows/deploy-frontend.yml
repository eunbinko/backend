name: Deploy frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "scripts/deploy/deploy-frontend.sh"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  HTML_DIR: /var/www/html
  STAGING_DIR: /tmp/kkoi-frontend-deploy-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: https://api.kkoi.kro.kr
          VITE_KAKAO_JAVASCRIPT_KEY: ${{ secrets.VITE_KAKAO_JAVASCRIPT_KEY }}
        run: |
          [ -n "$VITE_KAKAO_JAVASCRIPT_KEY" ] || { echo "VITE_KAKAO_JAVASCRIPT_KEY is required" >&2; exit 1; }
          npm ci
          npm run build

      - name: Upload built files to Linux server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 100.100.100.101
          port: "22"
          username: ${{ secrets.DEPLOY_FRONTEND_USER }}
          password: ${{ secrets.DEPLOY_FRONTEND_PASSWORD }}
          source: "frontend/dist/**,scripts/deploy/deploy-frontend.sh"
          target: ${{ env.STAGING_DIR }}

      - name: Publish to Nginx document root
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 100.100.100.101
          port: "22"
          username: ${{ secrets.DEPLOY_FRONTEND_USER }}
          password: ${{ secrets.DEPLOY_FRONTEND_PASSWORD }}
          script: bash "${{ env.STAGING_DIR }}/scripts/deploy/deploy-frontend.sh" "${{ env.STAGING_DIR }}" "${{ env.HTML_DIR }}"
