name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "requirements.txt"
      - "scripts/deploy/deploy-backend.sh"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  BACKEND_DIR: /home/test
  STAGING_DIR: /home/test/.deploy/backend-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload backend files to Linux server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 100.100.100.102
          port: "22"
          username: ${{ secrets.DEPLOY_BACKEND_USER }}
          password: ${{ secrets.DEPLOY_BACKEND_PASSWORD }}
          source: "app/**,requirements.txt,scripts/deploy/deploy-backend.sh"
          target: ${{ env.STAGING_DIR }}

      - name: Publish files under /home/test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 100.100.100.102
          port: "22"
          username: ${{ secrets.DEPLOY_BACKEND_USER }}
          password: ${{ secrets.DEPLOY_BACKEND_PASSWORD }}
          command_timeout: 10m
          script: bash "${{ env.STAGING_DIR }}/scripts/deploy/deploy-backend.sh" "${{ env.STAGING_DIR }}" "${{ env.BACKEND_DIR }}"
